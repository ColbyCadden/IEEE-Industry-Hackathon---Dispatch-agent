<!-- Hands-free voice call widget, embedded by dispatch/app.py (placeholders __API__, __CALL__, __OPENING__, __VOICE__).
     Listen (browser speech recognition) -> POST /turn -> speak the reply (ElevenLabs via /tts, else browser voice)
     -> listen again, until the agent has logged the report. -->
<style>
  :root { font-family: "Source Sans Pro", "Source Sans 3", system-ui, sans-serif; }
  body { margin: 0; }
  #vc { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border: 1px solid rgba(128,128,128,.35);
        border-radius: 12px; background: rgba(128,128,128,.06); }
  #btn { flex: 0 0 auto; width: 64px; height: 64px; border-radius: 50%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
         color: #fff; background: #ff4b4b; box-shadow: 0 4px 14px rgba(255,75,75,.35); transition: transform .15s; }
  #btn:hover { transform: scale(1.05); }
  #btn.on { background: #31333f; box-shadow: none; }
  #txt { flex: 1; min-width: 0; color: inherit; }
  #status { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #aaa; flex: 0 0 auto; }
  .listen #dot { background: #21c354; animation: pulse 1s infinite; }
  .think #dot { background: #faca2b; animation: pulse .6s infinite; }
  .speak #dot { background: #1c83e1; animation: pulse 1.2s infinite; }
  .done #dot { background: #21c354; }
  .error #dot { background: #ff4b4b; }
  @keyframes pulse { 50% { opacity: .25; } }
  #heard { font-size: 14px; opacity: .75; margin-top: 3px; min-height: 18px; white-space: nowrap; overflow: hidden;
           text-overflow: ellipsis; }
  #hint { font-size: 12px; opacity: .55; margin-top: 2px; }
  @media (prefers-color-scheme: dark) { #vc { color: #fafafa; } }
</style>
<div id="vc" class="idle">
  <button id="btn" title="Start / end the voice call"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button>
  <div id="txt">
    <div id="status"><span id="dot"></span><span id="label">Start a voice call and talk like the caller.</span></div>
    <div id="heard"></div>
    <div id="hint">__VOICE__</div>
  </div>
</div>
<script>
const API = "__API__", CALL = "__CALL__", OPENING = __OPENING__;
const MIC = '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>', STOP = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>';
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const vc = document.getElementById("vc"), btn = document.getElementById("btn");
const label = document.getElementById("label"), heard = document.getElementById("heard");
let on = false, greeted = false, rec = null, audio = null;

function status(text, mode) { label.textContent = text; vc.className = mode; }

async function speak(text) {
  status("Agent speaking...", "speak");
  try {
    const r = await fetch(API + "/tts", {method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify({text})});
    if (r.ok) {
      audio = new Audio(URL.createObjectURL(await r.blob()));
      await new Promise(res => { audio.onended = res; audio.onerror = res; audio.play().catch(res); });
      return;
    }
  } catch (e) { /* no voice service: use the browser's voice */ }
  await new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-CA"; u.rate = 1.05; u.onend = res; u.onerror = res;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    setTimeout(res, 4000 + text.length * 90);  // never hang if the browser drops the end event
  });
}

function listen() {
  if (!on) return;
  rec = new SR();
  rec.lang = "en-CA"; rec.interimResults = true; rec.continuous = false;
  let final = "";
  rec.onresult = e => {
    let interim = "";
    for (const r of e.results) { if (r.isFinal) final += r[0].transcript; else interim += r[0].transcript; }
    heard.textContent = "“" + (final || interim) + "”";
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed")
      stop("Microphone blocked: allow it in the address bar, then press the button again.", "error");
  };
  rec.onend = () => { if (!on) return; if (final.trim()) send(final.trim()); else listen(); };  // silence: keep listening
  status("Listening... speak now", "listen");
  try { rec.start(); } catch (e) { /* already started */ }
}

async function send(text) {
  status("Thinking...", "think");
  try {
    const r = await fetch(API + "/turn", {method: "POST", headers: {"Content-Type": "application/json"},
                                          body: JSON.stringify({call_id: CALL, text})});
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || r.status);
    heard.textContent = "";
    await speak(out.reply);
    if (out.done) stop("Report logged. Press New call for another caller.", "done");
    else listen();
  } catch (e) {
    stop("Lost the dashboard's voice service (" + e.message + "). Refresh the page.", "error");
  }
}

function stop(text, mode) {
  on = false;
  try { rec && rec.abort(); } catch (e) {}
  if (audio) audio.pause();
  speechSynthesis.cancel();
  btn.innerHTML = MIC; btn.classList.remove("on");
  status(text || "Call paused. Press the button to continue.", mode || "idle");
}

btn.onclick = async () => {
  if (on) return stop();
  if (!SR) return status("Voice input needs Chrome or Edge. You can still type below.", "error");
  on = true; btn.innerHTML = STOP; btn.classList.add("on");
  if (!greeted) { greeted = true; await speak(OPENING); }
  listen();
};
</script>
